<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AquaTrace · Bloom Fleet Graph</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%2334d7ff' d='M32 4 56 56 32 47 8 56Z'/%3E%3C/svg%3E">
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}html,body,#root{width:100%;height:100%;margin:0;overflow:hidden;background:#030613}.shell{width:100%;height:100%;background:radial-gradient(circle at 70% 20%,#123866 0%,#060a1b 38%,#02030b 85%)}button{font:inherit}.panel{position:fixed;z-index:4;top:18px;left:18px;width:min(390px,calc(100vw - 36px));padding:17px 18px;border:1px solid #37699199;border-radius:16px;background:linear-gradient(145deg,#0b1830e8,#071021d9);box-shadow:0 18px 50px #000a;backdrop-filter:blur(14px)}.eyebrow{color:#76d7ff;font-size:10px;font-weight:800;letter-spacing:.16em}h1{margin:5px 0 7px;font-size:20px;letter-spacing:-.02em;color:#f3f8ff}.description,.status{margin:0;color:#a8bed8;font-size:12px;line-height:1.45}.status{margin-top:9px;color:#83f3bf}.status.error{color:#ffc078}.controls{display:flex;gap:8px;align-items:center;margin-top:13px}.refresh{cursor:pointer;border:1px solid #3f83b6;border-radius:8px;padding:7px 10px;color:#dff4ff;background:#123a5f}.refresh:hover{background:#195582}.refresh:disabled{cursor:wait;opacity:.6}.hint{font-size:11px;color:#7e9bb8}.legend{display:flex;flex-wrap:wrap;gap:7px 11px;margin-top:13px}.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#c5d5e8}.dot{width:8px;height:8px;border-radius:999px;box-shadow:0 0 9px currentColor}.footer{position:fixed;z-index:3;bottom:14px;left:18px;color:#87a4c2;font-size:11px;text-shadow:0 2px 7px #000}.footer strong{color:#ffdf85}
  </style>
</head>
<body><div id="root"></div>
<script type="module">
import React,{useCallback,useEffect,useRef,useState}from 'https://esm.sh/react@18.3.1';
import{createRoot}from'https://esm.sh/react-dom@18.3.1/client';
import ForceGraph3D from'https://esm.sh/react-force-graph-3d@1.28.0?deps=react@18.3.1,react-dom@18.3.1,three@0.181.0';
import*as THREE from'https://esm.sh/three@0.181.0';
import{UnrealBloomPass}from'https://esm.sh/three@0.181.0/examples/jsm/postprocessing/UnrealBloomPass.js';
const h=React.createElement;
const TYPE_COLORS={Cargo:'#34d7ff',Tanker:'#ff9a4a',Passenger:'#ec77ff',Fishing:'#8cf38c',Tug:'#a993ff'};
const colorFor=type=>TYPE_COLORS[type]||'#99b7d4';
const km=(a,b)=>{const r=x=>x*Math.PI/180,dl=r(b.latitude-a.latitude),dn=r(b.longitude-a.longitude),v=Math.sin(dl/2)**2+Math.cos(r(a.latitude))*Math.cos(r(b.latitude))*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(v))};
function FleetGraph(){
 const graphRef=useRef(),bloomReady=useRef(false);const[graphData,setGraphData]=useState({nodes:[],links:[]});const[status,setStatus]=useState('Loading vessel topology…');const[loading,setLoading]=useState(false);
 const loadFleet=useCallback(async()=>{setLoading(true);try{const response=await fetch('/force-graph-data?limit=1000',{cache:'no-store'});if(!response.ok)throw Error(`API returned ${response.status}`);const rows=await response.json();const nodes=rows.filter(v=>Number.isFinite(+v.latitude)&&Number.isFinite(+v.longitude)).map(v=>({id:String(v.mmsi),mmsi:v.mmsi,latitude:+v.latitude,longitude:+v.longitude,speed:+v.sog_knots||0,course:+v.cog_degrees||0,type:v.vessel_type||'Unknown'}));const links=[];for(let i=0;i<nodes.length&&links.length<1800;i+=1){for(let j=i+1;j<nodes.length&&links.length<1800;j+=1){if(km(nodes[i],nodes[j])<=12)links.push({source:nodes[i].id,target:nodes[j].id})}}setGraphData({nodes,links});setStatus(`${nodes.length.toLocaleString()} vessels · ${links.length.toLocaleString()} proximity links · loaded ${new Date().toLocaleTimeString()}`);requestAnimationFrame(()=>graphRef.current?.zoomToFit(700,90))}catch(error){setStatus(`Unable to load fleet data: ${error.message}`)}finally{setLoading(false)}},[]);
 useEffect(()=>{loadFleet()},[loadFleet]);useEffect(()=>{const graph=graphRef.current;if(!graph||bloomReady.current)return;const composer=graph.postProcessingComposer?.();if(composer){composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.45,.7,.08));bloomReady.current=true}},[graphData]);
 const nodeObject=useCallback(node=>{const color=colorFor(node.type);return new THREE.Mesh(new THREE.SphereGeometry(1.45+Math.min(node.speed,30)/16,14,14),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:1.25,roughness:.25,metalness:.35}))},[]);
 return h('div',{className:'shell'},h(ForceGraph3D,{ref:graphRef,graphData,backgroundColor:'#030613',showNavInfo:false,controlType:'orbit',nodeId:'id',nodeThreeObject:nodeObject,nodeThreeObjectExtend:false,nodeLabel:n=>`<b>${n.mmsi}</b><br/>${n.type}<br/>${n.speed.toFixed(1)} kn · ${n.course.toFixed(0)}°`,linkColor:()=> '#419bc688',linkOpacity:.38,linkWidth:.7,linkDirectionalParticles:1,linkDirectionalParticleWidth:1.3,linkDirectionalParticleColor:()=> '#9de8ff',linkDirectionalParticleSpeed:.0022,d3AlphaDecay:.035,d3VelocityDecay:.24,cooldownTicks:140,onEngineStop:()=>graphRef.current?.zoomToFit(700,90)}),h('section',{className:'panel'},h('div',{className:'eyebrow'},'REACT · THREE.JS · BLOOM'),h('h1',null,'Fleet relationship graph'),h('p',{className:'description'},'Bloom-lit vessel nodes use live class colors. Links represent vessels within 12 km.'),h('p',{className:`status${status.startsWith('Unable')?' error':''}`},status),h('div',{className:'controls'},h('button',{className:'refresh',onClick:loadFleet,disabled:loading},loading?'Refreshing…':'Refresh data'),h('span',{className:'hint'},'Simulation stays stable between refreshes')),h('div',{className:'legend'},...Object.entries(TYPE_COLORS).map(([name,color])=>h('span',{className:'legend-item',key:name},h('i',{className:'dot',style:{background:color,color}}),name)))),h('div',{className:'footer'},h('strong',null,'Bloom active'),' · drag to orbit · scroll to zoom · hover for vessel telemetry'))
}
createRoot(document.getElementById('root')).render(h(FleetGraph));
</script></body></html>
